[project]
name = "boggle-game"
version = "0.1.0"
description = "Multiplayer Boggle game - learning project"
requires-python = ">=3.12"
dependencies = [
    "aioconsole>=0.8.2",
    "fastapi>=0.120.2",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
    "websockets>=15.0.1",
]

[project.scripts]
boggle = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-watch>=4.2.0",
    "mypy>=1.14.1",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
