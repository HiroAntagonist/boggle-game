[project]
name = "boggle-game"
version = "0.1.0"
description = "Multiplayer Boggle game - learning project"
requires-python = ">=3.12"
dependencies = [
    "aioconsole>=0.8.2",
    "pydantic>=2.12.3",
    "websockets>=15.0.1",
]

[project.scripts]
boggle = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-watch>=4.2.0",
    "mypy>=1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
