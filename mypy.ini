[mypy]
# Python version
python_version = 3.12

# Where to look for code
files = src/

# Basic type checking
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = False  # Start lenient, will tighten later

# Catch common errors
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True

# Be strict about None
no_implicit_optional = True
strict_optional = True

# Import handling
ignore_missing_imports = True  # Third-party libraries without type stubs won't cause errors
follow_imports = normal

# Output
show_error_codes = True
pretty = True

# Don't check test files as strictly (we'll adjust this later if needed)
[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = True
